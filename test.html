<div id="sc-prize-draw-modal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center p-4 z-[400] hidden">
    <div class="bg-slate-800 p-6 rounded-2xl w-full max-w-sm flex flex-col border border-slate-700 shadow-2xl">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-bold text-amber-400 uppercase">Sortear Brinde</h3>
            <button id="close-sc-prize-modal" class="text-slate-400 hover:text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
        </div>
        <div class="flex flex-col gap-3">
            <div class="flex gap-2">
                <div class="flex-1">
                    <label class="text-xs text-slate-400">De:</label>
                    <input type="number" id="sc-prize-min" value="1" class="w-full text-center text-lg font-bold p-2 bg-slate-900 border border-slate-600 rounded-lg text-white">
                </div>
                <div class="flex-1">
                    <label class="text-xs text-slate-400">Até:</label>
                    <input type="number" id="sc-prize-max" value="500" class="w-full text-center text-lg font-bold p-2 bg-slate-900 border border-slate-600 rounded-lg text-white">
                </div>
            </div>
            <div class="flex items-center gap-2">
                <input type="checkbox" id="sc-no-repeat" class="w-4 h-4 rounded border-slate-600">
                <label for="sc-no-repeat" class="text-sm text-slate-300">Não repetir sorteados</label>
            </div>
            <button id="sc-do-prize-draw" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-4 rounded-xl text-lg shadow-lg mt-2 active:scale-95 transition-transform">
                🎁 GERAR NÚMERO
            </button>
            <button id="sc-view-prizes-btn" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl text-sm shadow-lg mt-1 active:scale-95 transition-transform">
                🧐 VER SORTEADOS
            </button>
        </div>
    </div>
</div>
