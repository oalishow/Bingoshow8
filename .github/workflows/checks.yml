name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos (tsc)
        run: npm run lint
      - name: Teste de fumaça do painel
        run: npm run test:smoke
      - name: Teste do Modo Ensaio
        run: node tests/smoke/rehearsal.mjs
